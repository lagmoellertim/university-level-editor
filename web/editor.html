<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, user-scalable=no, initial-scale=1.0"
    />
    <title>Level Editor</title>

    <style>
      html,
      body {
        padding: 0;
        margin: 0;
        overflow: hidden;
        height: 100%;
        width: 100%;
        background-color: #1e1e1e;
        color: #cccccc;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      #screen {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        display: none;
      }

      #qtspinner {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #1e1e1e;
        z-index: 10;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #4a9eff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .app-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: #e6e6e6;
        margin: 0 0 6px 0;
        letter-spacing: 0.01em;
      }

      #qtstatus {
        font-size: 0.8rem;
        color: #888888;
      }

      #error-message {
        display: none;
        color: #e06c75;
        font-size: 0.8rem;
        margin-top: 10px;
        max-width: 400px;
        text-align: center;
      }
    </style>
  </head>
  <body onload="init()">
    <div id="qtspinner">
      <div class="spinner"></div>
      <div class="app-title">Level Editor</div>
      <div id="qtstatus">Loading...</div>
      <div id="error-message"></div>
      <noscript>
        <div style="color: #e06c75; margin-top: 10px; font-size: 0.8rem">
          JavaScript is required to run the Level Editor.
        </div>
      </noscript>
    </div>

    <div id="screen"></div>

    <script type="text/javascript">
      async function init() {
        const spinner = document.querySelector("#qtspinner");
        const screen = document.querySelector("#screen");
        const status = document.querySelector("#qtstatus");
        const errorBox = document.querySelector("#error-message");

        const showScreen = () => {
          spinner.style.display = "none";
          screen.style.display = "block";
        };

        const showError = (message) => {
          status.textContent = "Failed to load";
          errorBox.textContent = message;
          errorBox.style.display = "block";
        };

        try {
          const instance = await qtLoad({
            setStatus: function (text) {
              if (text) {
                status.textContent = text;
              }
            },
            qt: {
              onLoaded: () => showScreen(),
              onExit: (exitData) => {
                let text = "Application exited";
                if (exitData.code !== undefined) {
                  text += ` (code ${exitData.code})`;
                }
                if (exitData.text) {
                  text += `: ${exitData.text}`;
                }
                showError(text);
              },
              entryFunction: window.editor_entry,
              containerElements: [screen],
            },
          });
        } catch (e) {
          console.error(e);
          showError(e.message || "Error initializing application.");
        }
      }
    </script>
    <script src="editor.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
  </body>
</html>
